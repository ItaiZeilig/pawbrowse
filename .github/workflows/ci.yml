name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A known-good Chrome for the headless e2e (the runner's system Chrome
      # often never writes DevToolsActivePort under --headless=new).
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Syntax check
        run: |
          node --check mcp/server.mjs
          node --check extension/background.js
          node --check extension/options.js
      - name: Round-trip test
        run: npm test
      - name: Perception e2e (real headless Chrome)
        run: npm run test:e2e
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          DBUS_SESSION_BUS_ADDRESS: /dev/null   # silence dbus + let Chrome init in the minimal runner
          PAW_CHROME_ARGS: "--disable-gpu --no-first-run --no-zygote"
